<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прогресс — присед</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg: #f4f1ec; --card: #fff; --ink: #1d1b19; --muted: #6f6a63; --line: #e6e1d9; --accent: #e8572a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); width: 800px; padding: 28px;
         font: 18px/1.45 -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  .eyebrow { color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 32px; margin: 4px 0 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .stat span { color: var(--muted); font-size: 14px; }
  .stat b { display: block; font-size: 28px; }
  .stat b.up { color: #2f8f5b; }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; height: 360px; }
</style>
</head>
<body>
  <div class="eyebrow">Последние 6 недель</div>
  <h1>Приседания со штангой</h1>
  <div class="stats">
    <div class="stat"><span>Рабочий вес</span><b>70 кг</b></div>
    <div class="stat"><span>Прирост</span><b class="up">+15 кг</b></div>
    <div class="stat"><span>Тренировок</span><b>11</b></div>
  </div>
  <div class="chart"><canvas id="c"></canvas></div>
<script>
  // Данные подставляй из log.md.
  const labels = ["16 сен", "23 сен", "30 сен", "7 окт", "14 окт", "21 окт"];
  const weight = [55, 57.5, 60, 62.5, 65, 70];
  new Chart(document.getElementById("c"), {
    type: "line",
    data: { labels, datasets: [{ label: "кг", data: weight, borderColor: "#e8572a", backgroundColor: "#fde9e1",
            fill: true, tension: .3, pointRadius: 5, borderWidth: 3 }] },
    options: { animation: false, maintainAspectRatio: false, plugins: { legend: { display: false } },
               scales: { y: { grid: { color: "#eee9e2" } }, x: { grid: { display: false } } } }
  });
</script>
</body>
</html>
